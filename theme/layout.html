<!DOCTYPE html>
<html lang="{{ @Lang }}" data-appearance="{{ @Appearance }}">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark light">
	<meta name="generator" content="docs-go v{{ @Version }}">
	<meta name="theme-color" content="#ffffff">
	<title>{{ @Title }}</title>
	<meta name="description" content="{{ @Description }}">
	{{ @HeadExtra }}
	<meta property="og:type" content="{{ @OGType }}">
	<meta property="og:title" content="{{ @Title }}">
	<meta property="og:description" content="{{ @Description }}">
	<meta property="og:site_name" content="{{ @SiteTitle }}">
	<script src="{{ @InitURL }}"></script>
	<link rel="stylesheet" href="{{ @StyleURL }}">
</head>

<body>
	<a class="skip-link" href="#main-content">{{ @SkipToContent }}</a>
	<div class="app">
		<header class="topbar">
			<div class="topbar-inner">
				{{ @MenuButton }} {{ @Brand }} <nav class="nav" aria-label="Main">
					{{ @Nav }} </nav>
				<div class="topbar-actions">
					<div class="social-links">
						{{ @SocialLinks }} </div>
					<button class="icon-btn theme-btn" id="theme-button" type="button" aria-label="{{ @ThemeLabel }}"
						title="{{ @ThemeLabel }}">
						<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
							stroke-linecap="round">
							<circle cx="12" cy="12" r="4" />
							<path
								d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
						</svg>
						<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" />
						</svg>
					</button>
				</div>
			</div>
		</header>

		<div class="{{ @ShellClass }}">
			{{ @Sidebar }}
			<main class="main" id="main-content">
				<div class="{{ @ContentGridClass }}">
					<article class="doc">
						{{ @PageBody }} {{ @DocMeta }} {{ @PrevNext }} </article>
					{{ @Outline }}
				</div>
			</main>
		</div>

		<footer class="footer">
			<div class="footer-inner">
				<div class="footer-text">
					{{ @FooterText }} </div>
				<p class="footer-built">Built with <span>docs-go</span> v{{ @Version }}</p>
			</div>
		</footer>
	</div>

	<script type="application/json" id="docs-bootstrap">{{ @Bootstrap }}</script>
	<script src="{{ @AppURL }}"></script>
</body>

</html>
